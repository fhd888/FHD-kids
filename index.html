<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Hucha Mágica / Magic Piggy Bank</title>
  <style>
    :root {
      --bg-color: #f0f7ff;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --income: #2ecc71;
      --expense: #ff7675;
      --text: #2d3436;
    }

    * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    
    .container {
      background: var(--card-bg);
      max-width: 480px;
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 24px;
      border: 4px solid #dff9fb;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    select, input, button {
      font-size: 16px;
      border-radius: 12px;
      border: 2px solid #dfe6e9;
      padding: 10px 14px;
      outline: none;
    }

    .balance-card {
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      color: white;
      text-align: center;
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .balance-amount {
      font-size: 38px;
      font-weight: bold;
      margin-top: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-save {
      background-color: var(--income);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-spend {
      background-color: var(--expense);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    button:active { transform: scale(0.96); }

    .history-title {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .history-list {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 10px 14px;
      border-radius: 12px;
      border-left: 6px solid #ccc;
    }

    .history-item.income { border-color: var(--income); }
    .history-item.expense { border-color: var(--expense); }
    .item-date { font-size: 12px; color: #888; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <h2 id="app-title">🐷 Hucha Mágica</h2>
      <select id="lang-select" onchange="changeLanguage()">
        <option value="es">🇪🇸 Español</option>
        <option value="en">🇬🇧 English</option>
      </select>
    </div>

    <div class="balance-card">
      <span id="balance-label">Total Guardado</span>
      <div class="balance-amount" id="total-balance">$0.00</div>
    </div>

    <div class="form-group">
      <input type="text" id="desc-input" placeholder="¿Para qué es? (Ej: Paga, Helado)">
      <input type="number" id="amount-input" placeholder="Monto ($)" min="0.01" step="0.01">
      <input type="date" id="date-input">
      
      <div class="btn-row">
        <button class="btn-save" onclick="addTransaction('income')" id="btn-save">+ Guardar</button>
        <button class="btn-spend" onclick="addTransaction('expense')" id="btn-spend">- Gastar</button>
      </div>
    </div>

    <h3 class="history-title" id="history-label">Historial de Aventuras</h3>
    <ul class="history-list" id="transactions-list"></ul>
  </div>

  <script>
    const translations = {
      es: {
        appTitle: "🐷 Hucha Mágica",
        balanceLabel: "Total Guardado",
        descPlaceholder: "¿Para qué es? (Ej: Helado, Mesada)",
        amountPlaceholder: "Monto ($)",
        btnSave: "+ ¡Guardar!",
        btnSpend: "- ¡Gastar!",
        historyLabel: "📜 Historial de Aventuras",
        emptyHistory: "¡Aún no hay movimientos registrados!"
      },
      en: {
        appTitle: "🐷 Magic Piggy",
        balanceLabel: "Total Saved",
        descPlaceholder: "What is it for? (e.g. Ice cream, Allowance)",
        amountPlaceholder: "Amount ($)",
        btnSave: "+ Save!",
        btnSpend: "- Spend!",
        historyLabel: "📜 Adventure History",
        emptyHistory: "No transactions recorded yet!"
      }
    };

    let currentLang = 'es';
    let balance = 0;
    const transactions = [];

    // Asignar fecha actual por defecto en el input
    document.getElementById('date-input').value = new Date().toISOString().split('T')[0];

    function changeLanguage() {
      currentLang = document.getElementById('lang-select').value;
      const t = translations[currentLang];
      
      document.getElementById('app-title').textContent = t.appTitle;
      document.getElementById('balance-label').textContent = t.balanceLabel;
      document.getElementById('desc-input').placeholder = t.descPlaceholder;
      document.getElementById('amount-input').placeholder = t.amountPlaceholder;
      document.getElementById('btn-save').textContent = t.btnSave;
      document.getElementById('btn-spend').textContent = t.btnSpend;
      document.getElementById('history-label').textContent = t.historyLabel;
      renderList();
    }

    function addTransaction(type) {
      const descInput = document.getElementById('desc-input');
      const amountInput = document.getElementById('amount-input');
      const dateInput = document.getElementById('date-input');

      const desc = descInput.value.trim() || (type === 'income' ? 'Monedas' : 'Gasto');
      const amount = parseFloat(amountInput.value);
      const date = dateInput.value;

      if (isNaN(amount) || amount <= 0 || !date) return;

      if (type === 'income') {
        balance += amount;
      } else {
        balance -= amount;
      }

      transactions.unshift({ desc, amount, date, type });
      
      // Limpiar campos numéricos
      descInput.value = '';
      amountInput.value = '';

      updateUI();
    }

    function updateUI() {
      document.getElementById('total-balance').textContent = `$${balance.toFixed(2)}`;
      renderList();
    }

    function renderList() {
      const list = document.getElementById('transactions-list');
      list.innerHTML = '';

      if (transactions.length === 0) {
        list.innerHTML = `<li style="text-align: center; color: #888; font-size: 14px;">${translations[currentLang].emptyHistory}</li>`;
        return;
      }

      transactions.forEach(t => {
        const item = document.createElement('li');
        item.className = `history-item ${t.type}`;
        
        const sign = t.type === 'income' ? '+' : '-';
        const icon = t.type === 'income' ? '⭐' : '🛍️';

        item.innerHTML = `
          <div>
            <strong>${icon} ${t.desc}</strong>
            <div class="item-date">📅 ${t.date}</div>
          </div>
          <span style="font-weight: bold; color: ${t.type === 'income' ? '#2ecc71' : '#ff7675'};">
            ${sign}$${t.amount.toFixed(2)}
          </span>
        `;
        list.appendChild(item);
      });
    }

    renderList();
  </script>
</body>
</html>
